{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome | Venuelution</title>
    <link rel="stylesheet" href="{% static 'accounts/login.css' %}">
  </head>
  <body>
    <main class="auth-shell" aria-label="Venuelution account">
      <div class="backdrop" aria-hidden="true"></div>
      <div class="backdrop-shade" aria-hidden="true"></div>
      <section class="auth-window">
        <div class="glass-card dashboard-card">
          <p class="eyebrow"><span></span> Your community, together</p>
          <h1>Welcome,<br>{{ request.user.first_name|default:request.user.username }}.</h1>
          <p class="intro">You’re signed in and ready to plan your next gathering.</p>
          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button class="submit-button" type="submit">Sign out <span aria-hidden="true">→</span></button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
